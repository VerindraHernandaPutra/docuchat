services:
  api:
    build: .
    ports:
      - "8000:8000"                      # port_host:port_container
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/docuchat
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # Ollama di laptopmu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./chroma_db:/app/chroma_db       # vector DB dari Fase 2, tidak dimasukkan ke image
    depends_on:
      db:
        condition: service_healthy       # tunggu database benar-benar siap

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: docuchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data  # data tetap aman walau container dihapus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata: